[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "foundry-procurement-agent"
version = "0.1.0"
description = "Synthetic Microsoft Foundry procurement observability and evaluation PoC"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "agent-framework-core==1.16.0",
  "agent-framework-devui==1.0.0b260821",
  "agent-framework-foundry-hosting==1.0.0b260827",
  "agent-framework-foundry==1.11.0",
  "agent-framework-openai==1.14.1",
  "opentelemetry-api==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "azure-identity==1.26.0b2",
  "azure-ai-projects==2.3.0",
]

[project.scripts]
procurement-devui = "procurement_agent.devui_app:main"
procurement-hosted = "procurement_agent.hosted_app:main"

[tool.hatch.build.targets.wheel]
packages = ["procurement_agent", "trace_pipeline"]
