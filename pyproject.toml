[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "foundry-procurement-agent"
version = "0.1.0"
description = "Synthetic Microsoft Foundry procurement observability and evaluation PoC"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "agent-governance-toolkit[core]==4.1.0",
  "agent-framework-core==1.16.0",
  "agent-framework-devui==1.0.0b260821",
  "agent-framework-foundry-hosting==1.0.0b260827",
  "opentelemetry-api==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
procurement-devui = "procurement_agent.devui_app:main"
procurement-hosted = "procurement_agent.hosted_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent", "src/trace_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "procurement_agent/data"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: local integration tests",
  "external: requires external credentials or a deployed Foundry resource",
]
